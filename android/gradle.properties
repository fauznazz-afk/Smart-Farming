# JVM heap for the Gradle daemon.
#
# The Windows value was -Xmx8G -XX:MaxMetaspaceSize=4G, which reserves 12 GB.
# This machine only has 7.1 GB of RAM in total, so that configuration cannot
# possibly be satisfied and pushes the daemon into swap or an OOM kill.
#
# Budget for the whole toolchain on a 7 GB machine: roughly 1.5 GB for this
# daemon, 1 GB for the Kotlin compile daemon, and ~2 GB for whatever is
# already running (DE, browser, adb). Keep the sum well under physical RAM.
org.gradle.jvmargs=-Xmx1536M -XX:MaxMetaspaceSize=512M -XX:+HeapDumpOnOutOfMemoryError
kotlin.daemon.jvmargs=-Xmx1024M
org.gradle.daemon=true
org.gradle.parallel=false
org.gradle.caching=true
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
kotlin.incremental=false
